<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Connection Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header>
  <h1>Connection <span>Network</span></h1>
  <div class="stats" id="stats"></div>
  <div class="legend">
    <div class="legend-item" id="tog-friend" onclick="toggleType('friend')">
      <div class="legend-line friend"></div><span>Friend</span>
    </div>
    <div class="legend-item active" id="tog-family" onclick="toggleType('family')">
      <div class="legend-line family"></div><span>Family</span>
    </div>
    <div class="legend-item active" id="tog-bridge" onclick="toggleBridge()">
      <div class="legend-line bridge" style="width:28px;height:3px;background:#e05252;border-radius:1px;"></div><span>Family Bridges</span>
    </div>
    <div class="legend-item" id="tog-search" onclick="toggleSearch()" title="Search (/)">
      <span>⌕ Search</span>
    </div>
    <div class="size-control">
      <span title="Controls how large each person appears in the graph">Size</span>
      <select id="size-metric" onchange="setSizeMetric(this.value)">
        <option value="degree" selected title="Degree centrality: number of unique people this person is directly connected to. Simple neighbor count.">Degree</option>
        <option value="connections" title="Connections: total friend + family relationship entries for this person (original typed edge counts).">Connections</option>
        <option value="eigenvector" title="Eigenvector centrality: influence score. High when connected to other highly-connected people (PageRank is a close relative).">Eigenvector</option>
      </select>
    </div>
    <div class="reupload-btn" onclick="showUpload()" title="Load another file">↻ Load file</div>
  </div>
</header>
<div id="graph-wrap">
  <svg id="svg"></svg>
  <div id="tooltip"></div>
  <div class="controls">
    <button class="ctrl-btn" onclick="zoom(1.3)" title="Zoom in">+</button>
    <button class="ctrl-btn" onclick="zoom(0.77)" title="Zoom out">−</button>
    <button class="ctrl-btn" onclick="resetView()" title="Reset view">⌂</button>
  </div>
  <div class="search-wrap" id="search-wrap">
    <input id="search-input" placeholder="Search person…" oninput="doSearch(this.value)" onkeydown="if(event.key==='Escape')toggleSearch()"/>
    <div id="search-results"></div>
  </div>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3 id="sidebar-title">Items</h3>
      <button class="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <div class="sidebar-actions">
      <button onclick="sidebarSelectAll(true)">Select all</button>
      <button onclick="sidebarSelectAll(false)">Deselect all</button>
    </div>
    <div class="sidebar-content" id="sidebar-content"></div>
    <div class="sidebar-resize-handle" id="sidebar-resize"></div>
  </div>
  <!-- Upload overlay -->
  <div class="upload-area" id="upload-area">
    <div class="upload-box">
      <h2>Load connection matrix</h2>
      <p>Upload a CSV or XLSX file in the same matrix format<br>
         (first row = names, first column = names, cells = relationships or “x”).</p>
      <label class="upload-btn" for="file-input">Choose CSV / XLSX</label>
      <input type="file" id="file-input" accept=".csv,.xlsx,.xls" onchange="handleFile(this.files[0])"/>
    </div>
  </div>
</div>
<script>
// ── Parse matrix ────────────────────────────────────────────────────────────
function parseMatrix(csv) {
  const lines = csv.trim().split('\n');
  const header = lines[0].split(',');
  const colNames = header.slice(1);
  const nodeSet = new Map();
  const edgeMap = new Map();
  function canonical(name) {
    return name.trim();
  }
  colNames.forEach(n => {
    const c = canonical(n);
    if (c && !nodeSet.has(c)) nodeSet.set(c, { name: c, friendCount: 0, familyCount: 0 });
  });
  for (let i = 1; i < lines.length; i++) {
    const rowName = canonical(lines[i].split(',')[0]);
    if (rowName && !nodeSet.has(rowName)) nodeSet.set(rowName, { name: rowName, friendCount: 0, familyCount: 0 });
  }
  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split(',');
    const rowName = canonical(cells[0]);
    if (!rowName) continue;
    for (let j = 1; j < cells.length; j++) {
      const val = cells[j].trim();
      if (!val) continue;
      const colName = canonical(colNames[j - 1]);
      if (!colName || colName === rowName) continue;
      const pair = [rowName, colName].sort();
      const key = pair[0] + '|||' + pair[1];
      if (!edgeMap.has(key)) {
        edgeMap.set(key, { source: pair[0], target: pair[1], rel: val, type: val === 'x' ? 'friend' : 'family' });
      } else {
        const existing = edgeMap.get(key);
        if (val !== 'x' && existing.type === 'friend') {
          edgeMap.set(key, { source: pair[0], target: pair[1], rel: val, type: 'family' });
        }
        if (val !== 'x' && existing.type === 'family' && existing.rel !== val) {
          edgeMap.set(key, { ...existing, rel: existing.rel + ' / ' + val });
        }
      }
    }
  }
  const nodes = Array.from(nodeSet.values());
  const edges = Array.from(edgeMap.values());
  edges.forEach(e => {
    const src = nodeSet.get(e.source);
    const tgt = nodeSet.get(e.target);
    if (e.type === 'friend') {
      if (src) src.friendCount++;
      if (tgt) tgt.friendCount++;
    } else {
      if (src) src.familyCount++;
      if (tgt) tgt.familyCount++;
    }
  });
  nodes.forEach(n => {
    if (n.familyCount > 0 && n.friendCount > 0) n.connType = 'both';
    else if (n.familyCount > 0) n.connType = 'family';
    else if (n.friendCount > 0) n.connType = 'friend';
    else n.connType = 'none';
  });
  return { nodes, edges };
}
// ── Globals that need to live across rebuilds ───────────────────────────────
let nodes = [], edges = [];
let simulation, edgeSel, bridgeSel, relSel, nodeSel, groupSel;
let bridgeVisible = true;
const visible = { friend: false, family: true }; // Friend OFF by default
let nodeVisible = new Map(); // name -> bool
let edgeVisible = new Map(); // 'a|||b' -> bool
let currentSidebarType = null;
let allFamilies = [];
let allSibGroups = [];
let friendEdgeList = [];
let isolatedName = null; // null = no isolation
let sizeMetric = 'degree'; // degree | connections | eigenvector
let peopleSort = { key: 'name', dir: 1 }; // dir: 1 asc, -1 desc
const SGROUP_W = 68;
const svgEl = document.getElementById('svg');
const svg = d3.select(svgEl);
const container = svg.append('g').attr('id', 'container');
const zoomBehavior = d3.zoom().scaleExtent([0.1, 4]).on('zoom', e => container.attr('transform', e.transform));
svg.call(zoomBehavior);
const defs = svg.append('defs');
const lg = defs.append('linearGradient').attr('id', 'bothGrad').attr('x1', '0%').attr('y1', '0%').attr('x2', '100%').attr('y2', '100%');
lg.append('stop').attr('offset', '0%').attr('stop-color', '#58a6ff');
lg.append('stop').attr('offset', '100%').attr('stop-color', '#d4a843');
// ── File handling ───────────────────────────────────────────────────────────
function showUpload() {
  document.getElementById('upload-area').classList.remove('hidden');
}
function hideUpload() {
  document.getElementById('upload-area').classList.add('hidden');
}
function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  const isXlsx = /\.xlsx?$/i.test(file.name);
  reader.onload = e => {
    let csvText;
    if (isXlsx) {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      csvText = XLSX.utils.sheet_to_csv(sheet);
    } else {
      csvText = e.target.result;
    }
    try {
      const parsed = parseMatrix(csvText);
      nodes = parsed.nodes;
      edges = parsed.edges;
      // init visibility
      nodeVisible = new Map(nodes.map(n => [n.name, true]));
      edgeVisible = new Map(edges.map(e => {
        const key = [e.source, e.target].sort().join('|||');
        return [key, true];
      }));
      isolatedName = null;
      buildGraph();
      hideUpload();
    } catch (err) {
      alert('Could not parse the file. Make sure it is a matrix CSV/XLSX with names in the first row and first column.\n\n' + err.message);
    }
  };
  if (isXlsx) reader.readAsArrayBuffer(file);
  else reader.readAsText(file);
}
// ── Clean name for family extraction: ignore numbers & parentheticals ───────
function cleanNameParts(name) {
  // Remove content inside parentheses (and the parens themselves)
  let cleaned = name.replace(/\([^)]*\)/g, ' ');
  // Collapse whitespace
  cleaned = cleaned.replace(/\s+/g, ' ').trim();
  // Split into words
  let parts = cleaned.split(/\s+/).filter(Boolean);
  // Drop pure numeric tokens and tokens that are only punctuation/numbers
  parts = parts.filter(p => !/^\d+$/.test(p) && /[A-Za-z]/.test(p));
  return parts;
}
// ── Centrality metrics (degree, connections, eigenvector) ───────────────────
function computeCentralities() {
  const n = nodes.length;
  if (n === 0) return;
  const nameToIdx = new Map(nodes.map((nd, i) => [nd.name, i]));
  const adj = Array.from({ length: n }, () => []);
  edges.forEach(e => {
    const i = nameToIdx.get(e.source);
    const j = nameToIdx.get(e.target);
    if (i != null && j != null && i !== j) {
      adj[i].push(j);
      adj[j].push(i);
    }
  });
  // Degree = unique neighbors
  nodes.forEach((nd, i) => {
    nd.degree = adj[i].length;
  });
  // Eigenvector centrality via power iteration
  // Score is high when connected to other high-scoring people
  let scores = new Array(n).fill(1 / Math.sqrt(n));
  const MAX_ITER = 80;
  for (let iter = 0; iter < MAX_ITER; iter++) {
    const next = new Array(n).fill(0);
    for (let i = 0; i < n; i++) {
      for (const j of adj[i]) next[j] += scores[i];
    }
    let norm = 0;
    for (let i = 0; i < n; i++) norm += next[i] * next[i];
    norm = Math.sqrt(norm) || 1;
    for (let i = 0; i < n; i++) scores[i] = next[i] / norm;
  }
  // Normalize for sizing + store raw values
  const maxD = Math.max(...nodes.map(nd => nd.degree), 1);
  const maxConn = Math.max(...nodes.map(nd => (nd.friendCount || 0) + (nd.familyCount || 0)), 1);
  const maxE = Math.max(...scores, 1e-12);
  nodes.forEach((nd, i) => {
    nd.eigenvector = scores[i];
    nd.normDegree = nd.degree / maxD;
    nd.normConnections = ((nd.friendCount || 0) + (nd.familyCount || 0)) / maxConn;
    nd.normEigenvector = scores[i] / maxE;
  });
}
function nodeRadius(d) {
  const base = 7;
  let score = 0;
  if (sizeMetric === 'eigenvector') score = d.normEigenvector || 0;
  else if (sizeMetric === 'connections') score = d.normConnections || 0;
  else score = d.normDegree || 0; // degree default
  // map [0,1] → radius range ~7–22
  return base + score * 15;
}
function setSizeMetric(metric) {
  sizeMetric = metric;
  // Update all visible node circles
  if (nodeSel) {
    nodeSel.select('circle').attr('r', d => nodeRadius(d));
    nodeSel.select('text.node-label').attr('y', d => -(nodeRadius(d) + 4));
  }
  d3.selectAll('.sib-member').each(function(d) {
    const r = nodeRadius(d);
    const g = d3.select(this);
    g.select('circle').attr('r', r);
    g.select('text.node-label').attr('y', -(r + 4));
  });
  // Refresh collision radii and give the layout a gentle nudge
  if (simulation) {
    simulation.force('collision', d3.forceCollide(d =>
      d.isGroup ? ((d.members.length - 1) / 2 * SGROUP_W + 28) : (nodeRadius(d) + 4)
    ));
    simulation.alpha(0.12).restart();
  }
}
// ── Full graph rebuild ──────────────────────────────────────────────────────
function buildGraph() {
  // Clear previous visual elements
  container.selectAll('*').remove();
  if (simulation) simulation.stop();
  // ── Centrality metrics ──────────────────────────────────────────────────
  computeCentralities();
  // ── Family name assignment ──────────────────────────────────────────────
  // Use cleaned parts so numbers / (notes) are ignored; surname is last meaningful word
  const wordFreq = new Map();
  nodes.forEach(n => {
    const parts = cleanNameParts(n.name);
    // Use the last two meaningful tokens for frequency
    parts.slice(-2).forEach(w => wordFreq.set(w, (wordFreq.get(w) || 0) + 1));
  });
  nodes.forEach(n => {
    const parts = cleanNameParts(n.name);
    if (parts.length === 0) {
      // fallback: original last token without parens/numbers
      const raw = n.name.replace(/\([^)]*\)/g, '').trim().split(/\s+/).filter(Boolean);
      n.family = raw.length ? raw[raw.length - 1] : n.name;
      return;
    }
    if (parts.length === 1) {
      n.family = parts[0];
      return;
    }
    const last = parts[parts.length - 1];
    const prev = parts[parts.length - 2];
    const lastOk = /^[A-Z]/.test(last) && last.length > 2;
    const prevOk = /^[A-Z]/.test(prev) && prev.length > 2;
    // Prefer the more frequent of the two candidate surnames
    n.family = (prevOk && lastOk)
      ? ((wordFreq.get(prev) || 0) >= (wordFreq.get(last) || 0) ? prev : last)
      : last;
  });
  // ── BFS adjacency ───────────────────────────────────────────────────────
  const adjNames = new Map();
  nodes.forEach(n => adjNames.set(n.name, []));
  edges.forEach(e => {
    adjNames.get(e.source)?.push(e.target);
    adjNames.get(e.target)?.push(e.source);
  });
  function bfsPath(startSet, targetSet) {
    const visited = new Set(startSet);
    const queue = [...startSet].map(n => [n]);
    while (queue.length) {
      const path = queue.shift();
      const curr = path[path.length - 1];
      if (targetSet.has(curr)) return path;
      for (const nb of (adjNames.get(curr) || [])) {
        if (!visited.has(nb)) { visited.add(nb); queue.push([...path, nb]); }
      }
    }
    return null;
  }
  // ── Family bridge MST ───────────────────────────────────────────────────
  const familyMap = new Map();
  nodes.forEach(n => {
    if (!familyMap.has(n.family)) familyMap.set(n.family, []);
    familyMap.get(n.family).push(n.name);
  });
  const families = [...familyMap.keys()];
  allFamilies = families.map(f => ({ name: f, members: familyMap.get(f) }));
  const familyPairs = [];
  for (let i = 0; i < families.length; i++)
    for (let j = i + 1; j < families.length; j++) {
      const path = bfsPath(new Set(familyMap.get(families[i])), new Set(familyMap.get(families[j])));
      if (path) familyPairs.push({ a: families[i], b: families[j], weight: path.length, path });
    }
  familyPairs.sort((a, b) => a.weight - b.weight);
  const mstP = new Map(families.map(f => [f, f]));
  function mstFind(x) { if (mstP.get(x) !== x) mstP.set(x, mstFind(mstP.get(x))); return mstP.get(x); }
  const mstPaths = [];
  for (const fp of familyPairs) {
    const ra = mstFind(fp.a), rb = mstFind(fp.b);
    if (ra !== rb) { mstP.set(ra, rb); mstPaths.push(fp.path); }
  }
  const bridgePairSet = new Set();
  const bridgeSegments = [];
  mstPaths.forEach(path => {
    for (let i = 0; i < path.length - 1; i++) {
      const key = [path[i], path[i + 1]].sort().join('|||');
      if (!bridgePairSet.has(key)) {
        bridgePairSet.add(key);
        bridgeSegments.push({ sN: path[i], tN: path[i + 1] });
      }
    }
  });
  // ── Sibling groups ──────────────────────────────────────────────────────
  const SIB_RELS = new Set(['sibling', 'brother', 'sister']);
  const sibP = new Map(nodes.map(n => [n.name, n.name]));
  function sibFind(x) { if (sibP.get(x) !== x) sibP.set(x, sibFind(sibP.get(x))); return sibP.get(x); }
  edges.forEach(e => {
    if (SIB_RELS.has(e.rel?.toLowerCase())) {
      const rA = sibFind(e.source), rB = sibFind(e.target);
      if (rA !== rB) sibP.set(rA, rB);
    }
  });
  const rawSibGroups = new Map();
  nodes.forEach(n => {
    const rep = sibFind(n.name);
    if (!rawSibGroups.has(rep)) rawSibGroups.set(rep, []);
    rawSibGroups.get(rep).push(n);
  });
  allSibGroups = [...rawSibGroups.values()].filter(m => m.length >= 2).map((members, idx) => ({
    id: 'sib_' + idx,
    members: members.map(m => m.name),
    label: members.map(m => m.name.split(' ')[0]).join(', ')
  }));
  const simNodes = [];
  const nodeToSim = new Map();
  const nodeByName = new Map(nodes.map(n => [n.name, n]));
  let gid = 0;
  rawSibGroups.forEach(members => {
    if (members.length >= 2) {
      const ax = 200 + Math.random() * 500, ay = 100 + Math.random() * 400;
      const anchor = { name: '__grp_' + (gid++), isGroup: true, members, x: ax, y: ay, vx: 0, vy: 0 };
      simNodes.push(anchor);
      members.forEach((m, i) => {
        nodeToSim.set(m.name, anchor);
        m.x = ax + (i - (members.length - 1) / 2) * SGROUP_W;
        m.y = ay;
      });
    } else {
      const n = members[0];
      n.x = n.x || 200 + Math.random() * 500;
      n.y = n.y || 100 + Math.random() * 400;
      simNodes.push(n);
      nodeToSim.set(n.name, n);
    }
  });
  const rawEdges = edges
    .filter(e => !SIB_RELS.has(e.rel?.toLowerCase()))
    .map(e => ({ type: e.type, rel: e.rel, srcName: e.source, tgtName: e.target }));
  friendEdgeList = edges.filter(e => e.type === 'friend').map(e => ({
    key: [e.source, e.target].sort().join('|||'),
    source: e.source,
    target: e.target,
    label: e.source + ' — ' + e.target
  }));
  const simLinkKeys = new Set();
  const simLinks = [];
  rawEdges.forEach(e => {
    const ss = nodeToSim.get(e.srcName), st = nodeToSim.get(e.tgtName);
    if (!ss || !st || ss === st) return;
    const key = [ss.name, st.name].sort().join('|||');
    if (!simLinkKeys.has(key)) {
      simLinkKeys.add(key);
      simLinks.push({ source: ss.name, target: st.name });
    }
  });
  // ── Stats ───────────────────────────────────────────────────────────────
  const friendEdges = edges.filter(e => e.type === 'friend').length;
  const familyEdges = edges.filter(e => e.type === 'family').length;
  const sibGroupCount = allSibGroups.length;
  document.getElementById('stats').innerHTML =
    `<span onclick="openSidebar('people')"><b>${nodes.length}</b> people</span>
     <span onclick="openSidebar('families')"><b>${families.length}</b> families</span>
     <span onclick="openSidebar('siblings')"><b>${sibGroupCount}</b> sibling groups</span>
     <span onclick="openSidebar('friendships')"><b>${friendEdges}</b> friendships</span>`;
  // ── Simulation ──────────────────────────────────────────────────────────
  const { width, height } = svgEl.getBoundingClientRect();
  simulation = d3.forceSimulation(simNodes)
    .force('link', d3.forceLink(simLinks).id(d => d.name).distance(130))
    .force('charge', d3.forceManyBody().strength(-320))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide(d => d.isGroup ? ((d.members.length - 1) / 2 * SGROUP_W + 28) : (nodeRadius(d) + 4)))
    .alphaTarget(0);
  // ── Edges ───────────────────────────────────────────────────────────────
  const edgeLayer = container.append('g').attr('id', 'edges');
  edgeSel = edgeLayer.selectAll('line').data(rawEdges).enter().append('line')
    .attr('class', d => d.type === 'friend' ? 'edge-friend' : 'edge-family')
    .style('display', d => visible[d.type] ? null : 'none');
  // ── Bridges ─────────────────────────────────────────────────────────────
  const bridgeData = bridgeSegments.map(s => ({
    src: nodeByName.get(s.sN), tgt: nodeByName.get(s.tN)
  })).filter(d => d.src && d.tgt);
  const bridgeGroupEl = container.append('g').attr('id', 'bridges');
  bridgeSel = bridgeGroupEl.selectAll('line').data(bridgeData).enter().append('line')
    .attr('class', 'edge-bridge')
    .classed('hidden', !bridgeVisible);
  // ── Relationship labels ─────────────────────────────────────────────────
  const relLayer = container.append('g').attr('id', 'rel-labels');
  const familyRaw = rawEdges.filter(e => e.type === 'family');
  relSel = relLayer.selectAll('g').data(familyRaw).enter().append('g').attr('class', 'rel-label')
    .style('display', visible.family ? null : 'none');
  relSel.append('rect').attr('class', 'rel-label-bg').attr('rx', 3).attr('ry', 3);
  relSel.append('text').attr('class', 'rel-label-text').attr('dy', '0.35em').text(d => d.rel);
  // ── Sibling group bars ──────────────────────────────────────────────────
  const groupLayer = container.append('g').attr('id', 'groups');
  groupSel = groupLayer.selectAll('g')
    .data(simNodes.filter(n => n.isGroup))
    .enter().append('g').attr('class', 'sibling-group');
  groupSel.each(function(anchor) {
    const g = d3.select(this);
    const n = anchor.members.length;
    const halfW = (n - 1) / 2 * SGROUP_W;
    g.append('line').attr('class', 'sibling-bar-line')
      .attr('x1', -halfW).attr('y1', 0).attr('x2', halfW).attr('y2', 0);
    g.append('line').attr('class', 'sibling-tick')
      .attr('x1', 0).attr('y1', -7).attr('x2', 0).attr('y2', 7);
    anchor.members.forEach((m, i) => {
      const ox = (i - (n - 1) / 2) * SGROUP_W;
      const r = nodeRadius(m);
      const mg = g.append('g').attr('class', 'node sib-member').attr('data-name', m.name).datum(m);
      mg.append('circle').attr('cx', ox).attr('cy', 0).attr('r', r)
        .attr('class', 'type-person' + (m.connType === 'family' ? ' connected-family' : m.connType === 'both' ? ' connected-both' : ''))
        .style('stroke', m.connType === 'both' ? 'url(#bothGrad)' : m.connType === 'family' ? '#d4a843' : m.connType === 'friend' ? '#3d8bcd' : '#444c56');
      mg.append('text').attr('class', 'node-label')
        .attr('x', ox).attr('y', -(r + 4)).attr('text-anchor', 'middle').text(m.name);
      mg.on('mouseover', (event) => showTooltip(event, m))
        .on('mousemove', moveTooltip)
        .on('mouseout', hideTooltip)
        .on('dblclick', (event) => {
          event.stopPropagation();
          toggleIsolation(m.name);
          // also unfix the group anchor if fixed
          if (anchor.fx != null) { anchor.fx = null; anchor.fy = null; }
        });
    });
  });

function doSearch(q) {
  const resultsEl = document.getElementById('search-results');
  if (!q || !q.trim()) {
    // restoring full view: respect isolation if active
    clearHighlight();
    resultsEl.classList.remove('visible');
    resultsEl.innerHTML = '';
    return;
  }
  const lq = q.toLowerCase().trim();
  const matches = nodes.filter(n => n.name.toLowerCase().includes(lq) && nodeVisible.get(n.name) !== false);
  if (matches.length === 0) {
    resultsEl.innerHTML = '<div class="search-result-item" style="color:var(--muted);cursor:default">No matches</div>';
    resultsEl.classList.add('visible');
    // still fade non-matches for visual feedback
    const matchNames = new Set();
    if (nodeSel) nodeSel.classed('faded', n => !matchNames.has(n.name));
    d3.selectAll('.sib-member').classed('faded', true);
    if (edgeSel) edgeSel.classed('faded', true);
    if (relSel) relSel.style('opacity', 0);
    return;
  }
  // Build result list
  resultsEl.innerHTML = matches.slice(0, 30).map(n =>
    `<div class="search-result-item" data-name="${n.name}">${n.name}<span class="sr-family">${n.family || ''}</span></div>`
  ).join('');
  resultsEl.classList.add('visible');
  // Attach click handlers
  resultsEl.querySelectorAll('.search-result-item').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.getAttribute('data-name');
      focusOnNode(name);
      // keep search open but clear input? or leave
      document.getElementById('search-input').value = name;
      doSearch(name); // re-filter to just this + neighbors
    });
  });
  // Visual highlight: show matches + their neighbors
  const matchNames = new Set(matches.map(n => n.name));
  edges.forEach(e => {
    if (matchNames.has(e.source) && nodeVisible.get(e.target)) matchNames.add(e.target);
    if (matchNames.has(e.target) && nodeVisible.get(e.source)) matchNames.add(e.source);
  });
  // if isolation is active, intersect with isolation set
  if (isolatedName) {
    const iso = getIsolationSet(isolatedName);
    for (const n of [...matchNames]) if (!iso.has(n)) matchNames.delete(n);
  }
  if (nodeSel) nodeSel.classed('faded', n => !matchNames.has(n.name) || !nodeVisible.get(n.name));
  d3.selectAll('.sib-member').classed('faded', function() {
    const name = this.getAttribute('data-name');
    return !matchNames.has(name) || !nodeVisible.get(name);
  });
  if (edgeSel) edgeSel.classed('faded', e => {
    const key = [e.srcName, e.tgtName].sort().join('|||');
    return (!matchNames.has(e.srcName) && !matchNames.has(e.tgtName)) || edgeVisible.get(key) === false;
  });
  if (relSel) relSel.style('opacity', e => {
    const key = [e.srcName, e.tgtName].sort().join('|||');
    return ((matchNames.has(e.srcName) || matchNames.has(e.tgtName)) && edgeVisible.get(key) !== false) ? 1 : 0;
  });
}
function focusOnNode(name) {
  const node = window._nodeByName?.get(name);
  if (!node || node.x == null || node.y == null) return;
  const { width, height } = svgEl.getBoundingClientRect();
  // Current transform
  const t = d3.zoomTransform(svgEl);
  // Desired: center the node
  const scale = Math.max(t.k, 1.2);
  const tx = width / 2 - node.x * scale;
  const ty = height / 2 - node.y * scale;
  svg.transition().duration(600)
    .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  // Brief highlight
  // (do not clear isolation – just zoom)
  const matchNames = new Set([name]);
  edges.forEach(e => {
    if (e.source === name) matchNames.add(e.target);
    if (e.target === name) matchNames.add(e.source);
  });
  if (nodeSel) {
    nodeSel.classed('faded', n => !matchNames.has(n.name));
    nodeSel.filter(n => n.name === name).select('circle').classed('highlighted', true);
    setTimeout(() => {
      if (nodeSel) nodeSel.selectAll('circle').classed('highlighted', false);
      // restore isolation if it was active
      if (isolatedName) applyIsolation(isolatedName);
      else clearHighlight();
    }, 2000);
  }
  d3.selectAll('.sib-member').classed('faded', function() {
    return !matchNames.has(this.getAttribute('data-name'));
  });
  if (edgeSel) edgeSel.classed('faded', e => !matchNames.has(e.srcName) && !matchNames.has(e.tgtName));
  if (relSel) relSel.style('opacity', e => (matchNames.has(e.srcName) || matchNames.has(e.tgtName)) ? 1 : 0);
}
document.addEventListener('keydown', e => {
  if (e.key === '/') { e.preventDefault(); toggleSearch(); }
  if (e.key === 'Escape') {
    const w = document.getElementById('search-wrap');
    if (w.style.display === 'block') toggleSearch();
    closeSidebar();
    // also clear isolation on Escape
    if (isolatedName) clearIsolation();
  }
});
// Close sidebar / search / isolation when clicking graph background
svg.on('click', function(event) {
  if (event.target === svgEl) {
    closeSidebar();
    forceHideTooltip();
  }
});
// Double-click empty space clears isolation
svg.on('dblclick', function(event) {
  if (event.target === svgEl) {
    if (isolatedName) clearIsolation();
  }
});
// ── Zoom ────────────────────────────────────────────────────────────────────
function zoom(factor) { svg.transition().duration(300).call(zoomBehavior.scaleBy, factor); }
function resetView() {
  const { width, height } = svgEl.getBoundingClientRect();
  svg.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.9).translate(-width / 2, -height / 2));
}
// ── Sidebar resize ──────────────────────────────────────────────────────────
(function initSidebarResize() {
  const sidebar = document.getElementById('sidebar');
  const handle = document.getElementById('sidebar-resize');
  if (!sidebar || !handle) return;
  let startX = 0, startW = 0;
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    e.stopPropagation();
    startX = e.clientX;
    startW = sidebar.getBoundingClientRect().width;
    sidebar.classList.add('resizing');
    document.body.style.cursor = 'col-resize';
    const onMove = ev => {
      const dx = ev.clientX - startX;
      const newW = Math.max(280, Math.min(window.innerWidth * 0.8, startW + dx));
      sidebar.style.width = newW + 'px';
    };
    const onUp = () => {
      sidebar.classList.remove('resizing');
      document.body.style.cursor = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
})();
</script>
